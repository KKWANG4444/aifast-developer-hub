name: Verify developer matrix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: 检查站点地图日期与规范地址
        run: python3 scripts/audit-sitemap.py
      - name: Verify human and machine-readable entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s README_EN.md
          test -s llms.txt
          test -s llms-full.txt
          grep -Fq 'https://www.aifast.hk/' README.md
          grep -Fq 'https://gitee.com/kkwwww4444' README.md
          grep -Fq 'https://docs.aifast.hk/model-check/' README.md
          grep -Fq 'https://docs.aifast.hk/start/' README.md
          grep -Fq 'https://docs.aifast.hk/tools/codex/' README.md
          grep -Fq 'https://docs.aifast.hk/troubleshooting/codex-gateway-checklist/' README.md
          grep -Fq 'https://docs.aifast.hk/guides/model-check-report-guide/' README.md
          grep -Fq '普通用户仍在网页检测' README.md
          grep -Fq 'claude-fable-5-2' README.md
          grep -Fq 'claude-fable-5-2' README_EN.md
          grep -Fq 'claude-fable-5-2' index.html
          grep -Fq '2026-11-10' index.html
          grep -Fq 'https://docs.aifast.hk/en/providers/claude-api/' index.html
          grep -Fq '不是本仓库实测成功率或独立 SLA' README.md
          grep -Fq 'not a measured result from this repository or an independent SLA' README_EN.md
          grep -Fq 'not a measured result from this repository or an independent SLA' llms.txt
          grep -Fq 'not a measured result from this repository or an independent SLA' llms-full.txt
          grep -Fq 'https://docs.aifast.hk/start/' llms.txt
          grep -Fq 'https://docs.aifast.hk/start/' llms-full.txt
          grep -Fq 'https://docs.aifast.hk/tools/codex/' llms.txt
          grep -Fq 'https://docs.aifast.hk/troubleshooting/codex-gateway-checklist/' llms-full.txt
          grep -Fq 'register?channel=c_zfxp7cp4' llms-full.txt
          ! grep -Fq 'register?channel=c_uoqg7aoy' llms-full.txt
          ! grep -Fq 'openai-compatible-api-check' llms.txt
          ! grep -Fq 'openai-compatible-api-check' llms-full.txt
          grep -Fq 'AI-API-Stability-Tracker' README.md
          grep -Fq 'https://docs.aifast.hk/model-check/' llms-full.txt
