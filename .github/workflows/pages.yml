name: Verify developer hub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published source via GitHub API
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPOSITORY']
          rev = os.environ['REVISION']
          base = f"https://raw.githubusercontent.com/{repo}/{rev}"
          with urllib.request.urlopen(base + "/index.html", timeout=20) as r:
              html = r.read().decode("utf-8")
          assert "<title>OpenAI-Compatible API Testing &amp; Troubleshooting | AIFast Developer Hub</title>" in html or "<title>OpenAI-Compatible API Testing & Troubleshooting | AIFast Developer Hub</title>" in html
          assert html.count("<h1>") == 1
          assert "https://docs.aifast.hk/model-check/" in html
          assert "https://www.aifast.hk/v1" in html
          print(json.dumps({"index": "ok", "h1": 1, "bytes": len(html)}))
          PY
