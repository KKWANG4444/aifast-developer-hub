name: Verify developer hub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published source via GitHub API
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPOSITORY']
          rev = os.environ['REVISION']
          base = f"https://raw.githubusercontent.com/{repo}/{rev}"
          with urllib.request.urlopen(base + "/index.html", timeout=20) as r:
              html = r.read().decode("utf-8")
          assert "<title>OpenAI-Compatible API Testing, Cursor &amp; Dify Troubleshooting | AIFast</title>" in html or "<title>OpenAI-Compatible API Testing, Cursor & Dify Troubleshooting | AIFast</title>" in html
          assert html.count("<h1>") == 1
          assert "Cursor custom API" in html and "Dify endpoint" in html
          assert "https://docs.aifast.hk/en/model-check/" in html
          assert "https://www.aifast.hk/v1" in html
          assert "openai_api_preflight.py" in html
          with urllib.request.urlopen(base + "/tools/base-url-checker/index.html", timeout=20) as r:
              tool = r.read().decode("utf-8")
          assert "OpenAI Base URL Checker" in tool and "v1/v1" in tool
          assert 'application/ld+json' in html and 'FAQPage' in html
          for path in ('robots.txt', 'sitemap.xml'):
              with urllib.request.urlopen(base + '/' + path, timeout=20) as r:
                  assert r.status == 200 and r.read()
          print(json.dumps({"index": "ok", "h1": 1, "seo_geo": "ok", "bytes": len(html)}))
          PY
